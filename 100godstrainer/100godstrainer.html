<!DOCTYPE html>
<html>
<head>
	<title>Word Display</title>
	<script src="script.js"></script>
	<style>
        body {
            /* display: flex;
            flex-direction: column; */
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 50px;
        }

        .flex-container {
                        /* We first create a flex layout context */
            display: flex;
            
            /* Then we define the flow direction 
                and if we allow the items to wrap 
            * Remember this is the same as:
            * flex-direction: row;
            * flex-wrap: wrap;
            */
            flex-flow: row wrap;
            
            /* Then we define how is distributed the remaining space */
            justify-content: space-around;
            
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .flex-item {
            /* background: tomato; */
            padding: 5px;
            /* width: 200px;
            height: 150px; */
            margin-top: 10px;
            /* line-height: 150px; */
            /* color: white; */
            /* font-weight: bold; */
            /* font-size: 3em; */
            text-align: center;
        }

        #wordImage {
            width: 500px;
        }

	</style>
</head>
<body>

<div class="flex-container">
	<div class="flex-item" id="godDisplay" onclick="attribute = 'godDisplay';">G</div>

    <div class="flex-item" id="landDisplay" onclick="attribute = 'landDisplay';">L</div>

    <div class="flex-item" id="objectDisplay" onclick="attribute = 'objectDisplay';">O</div>

    <div class="flex-item" id="schaalDisplay" onclick="attribute = 'schaalDisplay';">S</div>

    <div class="flex-item" id="atoomDisplay" onclick="attribute = 'atoomDisplay';">A</div>

    <div class="flex-item" id="eeuwDisplay" onclick="attribute = 'eeuwDisplay';">E</div>
</div>

    <img id="wordImage" src="" alt="" width="500">


</body>
</html>
