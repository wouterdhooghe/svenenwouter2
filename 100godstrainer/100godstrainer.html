<!DOCTYPE html>
<html>
<head>
	<title>Word Display</title>
	<script src="script.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/zingtouch/1.0.6/zingtouch.min.js"></script>
	<style>
        body {
            /* display: flex;
            flex-direction: column; */
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 50px;
        }

        .flex-container {
                        /* We first create a flex layout context */
            display: flex;
            
            /* Then we define the flow direction 
                and if we allow the items to wrap 
            * Remember this is the same as:
            * flex-direction: row;
            * flex-wrap: wrap;
            */
            flex-flow: row wrap;
            
            /* Then we define how is distributed the remaining space */
            justify-content: space-around;
            
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .flex-item {
            /* background: tomato; */
            padding: 5px;
            /* width: 200px;
            height: 150px; */
            margin-top: 10px;
            /* line-height: 150px; */
            /* color: white; */
            /* font-weight: bold; */
            /* font-size: 3em; */
            text-align: center;
        }

        #wordImage {
            width: 500px;
        }

		/* Trainer zones */
		#trainerControls { margin-top: 20px; }
		.mode-button { font-size: 20px; padding: 6px 12px; margin: 0 6px; }
		#displays { margin-top: 16px; }
		#numberDisplay, #lettersDisplay { font-size: 60px; margin: 8px 0; cursor: pointer; }
		#zones { margin-top: 16px; }
		.zones-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
		.zone { border: 1px solid #ccc; border-radius: 8px; padding: 10px 14px; font-size: 24px; user-select: none; }
		.zone--active { background: #ffeb3b; border-color: #fbc02d; }

	</style>
</head>
<body>

<div class="flex-container">
	<div class="flex-item" id="godDisplay" onclick="attribute = 'godDisplay';">G</div>

    <div class="flex-item" id="landDisplay" onclick="attribute = 'landDisplay';">L</div>

    <div class="flex-item" id="objectDisplay" onclick="attribute = 'objectDisplay';">O</div>

    <div class="flex-item" id="schaalDisplay" onclick="attribute = 'schaalDisplay';">S</div>

    <div class="flex-item" id="atoomDisplay" onclick="attribute = 'atoomDisplay';">A</div>

    <div class="flex-item" id="eeuwDisplay" onclick="attribute = 'eeuwDisplay';">E</div>
</div>

    <img id="wordImage" src="" alt="" width="500">

	<div id="trainerControls">
		<button id="modeNumber" class="mode-button">Nummer</button>
		<button id="modeLetters" class="mode-button">Letters</button>
	</div>

	<div id="displays">
		<div id="numberDisplay" aria-label="huidig getal" title="Swipe links/rechts of gebruik zones">0</div>
		<div id="lettersDisplay" aria-label="huidige 2 letters" title="Swipe links/rechts of gebruik letterzones">aa</div>
	</div>

	<div id="zones">
		<div id="numberZones" class="zones-row"></div>
		<div id="letterZones" class="zones-row"></div>
	</div>

	<script src="trainer.js"></script>

</body>
</html>
